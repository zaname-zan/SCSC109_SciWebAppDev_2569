<!doctype html>
<html>
  <head>
    <style>
      body {
        font-family: sans-serif;
        background: #fdf6e3;
      }
      h1 {
        color: #d35400;
      }
      details {
        border: 1px solid #cccccc;
        border-radius: 8px;
        padding: 10px;
      }
      summary {
        cursor: pointer;
        font-weight: bold;
      }
      img {
        border-radius: 12px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
      }
      button {
        padding: 10px 20px;
        border: none;
        border-radius: 6px;
        background: #2ecc71;
        color: white;
        cursor: pointer;
        transition: 0.2s;
      }
      button:hover {
        background: #27ae60;
      }
    </style>
    <title>My First Page</title>
  </head>
  <body>
    <h1>Hello, World!</h1>
    <p>This is my first web page. (created by Thaned)</p>
    <details>
      <summary>Click to expand</summary>
      <p>Hidden content appears here!</p>
    </details>
    <img src="cat.jpg" alt="A cute cat" width="300" />
    <button id="myBtn">Click me</button>
    <script>
      document.getElementById("myBtn").addEventListener("click", function () {
        alert("Hello, you clicked!");
      });
    </script>

</body>
</html>
